services:
  postgres:
    image: postgres:18.6-alpine
    container_name: rifa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Define DB_DATABASE in api/.env}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-rifa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD in api/.env}
      RIFA_DB_USER: ${DB_USERNAME:?Define DB_USERNAME in api/.env}
      RIFA_DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in api/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
    name: rifa-postgres-data
